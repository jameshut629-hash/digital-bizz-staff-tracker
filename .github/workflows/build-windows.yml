name: Build Windows EXE


on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Project zip download karein
        run: curl.exe -L -o project.zip "https://muse.ai/files/1422772990918355/2005266313498497/92n2jczmg2o6y318z9w0050n/staff-tracker-flutter-v9.1.1-src.zip"
      - name: Zip extract karein
        run: Expand-Archive -Path project.zip -DestinationPath project
      - name: CMake policy patch lagayen
        run: |
          $f = 'project/staff-tracker-flutter/windows/CMakeLists.txt'
          $c = Get-Content $f -Raw
          Set-Content $f ("set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n" + $c) -NoNewline
          Get-Content $f -TotalCount 5
      - name: Flutter install karein (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: CMake version check karein
        run: cmake --version; where.exe cmake
      - name: Dependencies lein
        run: flutter pub get
        working-directory: project/staff-tracker-flutter
      - name: Windows EXE banayen
        run: flutter build windows --release
        working-directory: project/staff-tracker-flutter
      - name: Visual C++ Redistributable download karein
        run: curl.exe -L -o windows\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        working-directory: project/staff-tracker-flutter
      - name: Inno Setup install karein
        run: choco install innosetup --yes
      - name: Setup.exe banayen (ISCC)
        run: ISCC.exe "project/staff-tracker-flutter/windows/installer.iss"
      - name: Setup.exe artifact upload karein
        uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: project/staff-tracker-flutter/windows/windows/Output/PerformanceGear-Tracker-Setup.exe
      - name: Setup.exe ko v9.1 release par upload karein
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.1.1
          name: v9.1 Performance Gear Tracker
          files: project/staff-tracker-flutter/windows/windows/Output/PerformanceGear-Tracker-Setup.exe
