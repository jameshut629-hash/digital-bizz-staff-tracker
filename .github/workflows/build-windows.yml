name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Project zip download karein
        run: curl.exe -L -o project.zip "https://muse.ai/files/1422772990918355/1116366464113605/eo0pvciy27f4izt52q9b691j/staff-tracker-flutter-v8-installer-src.zip"
      - name: Zip extract karein
        run: Expand-Archive -Path project.zip -DestinationPath project
      - name: CMake policy patch lagayen
        run: |
          $f = 'project/staff-tracker-flutter/windows/CMakeLists.txt'
          $c = Get-Content $f -Raw
          Set-Content $f ("set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n" + $c) -NoNewline
          Get-Content $f -TotalCount 5
      - name: Flutter install karein (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: CMake version check karein
        run: cmake --version; where.exe cmake
      - name: Dependencies lein
        run: flutter pub get
        working-directory: project/staff-tracker-flutter
      - name: Windows EXE banayen
        run: flutter build windows --release
        working-directory: project/staff-tracker-flutter
      - name: Inno Setup install karein
        run: choco install innosetup -y
      - name: Setup installer banayen
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss'
        working-directory: project/staff-tracker-flutter
      - name: Setup installer ko download ke liye rakhen
        uses: actions/upload-artifact@v4
        with:
          name: PerformanceGear-Tracker-Setup
          path: project/staff-tracker-flutter/windows/windows/Output/PerformanceGear-Tracker-Setup.exe
