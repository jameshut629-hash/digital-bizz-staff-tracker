name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Project zip download karein
        run: curl.exe -L -o project.zip "https://muse.ai/files/1422772990918355/1476018521088976/t9mrnlf1n6m5fg8q6gn8gw8t/staff-tracker-source-v8.zip"
      - name: Zip extract karein
        run: Expand-Archive -Path project.zip -DestinationPath project
      - name: CMake policy patch lagayen
        run: |
          $f = 'project/staff-tracker-flutter/windows/CMakeLists.txt'
          $c = Get-Content $f -Raw
          Set-Content $f ("set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n" + $c) -NoNewline
          Get-Content $f -TotalCount 5
      - name: Flutter install karein (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: CMake version check karein
        run: cmake --version; where.exe cmake
      - name: Dependencies lein
        run: flutter pub get
        working-directory: project/staff-tracker-flutter
      - name: Windows EXE banayen
        run: flutter build windows --release
        working-directory: project/staff-tracker-flutter
      - name: EXE ko download ke liye rakhen
        uses: actions/upload-artifact@v4
        with:
          name: digital-bizz-staff-tracker-windows
          path: project/staff-tracker-flutter/build/windows/x64/runner/Release/
